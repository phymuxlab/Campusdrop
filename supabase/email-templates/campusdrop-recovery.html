<!-- CampusDrop: paste into Supabase Authentication > Email Templates > Reset Password -->
<div style="margin:0;padding:40px 18px;background:#f5f8fa;font-family:Arial,sans-serif;color:#0f172a;">
  <div style="max-width:560px;margin:auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden;">
    <div style="padding:26px;text-align:center;background:#0b2c4d;">
      <img src="{{ .SiteURL }}/campusdrop-logo.png" alt="CampusDrop" style="max-width:210px;height:auto;">
    </div>
    <div style="padding:34px 30px;">
      <p style="margin:0 0 8px;color:#149866;font-weight:700;font-size:13px;">ACCOUNT SECURITY</p>
      <h1 style="margin:0 0 14px;font-size:28px;">Reset your CampusDrop password</h1>
      <p style="line-height:1.65;color:#667085;">We received a request to reset your CampusDrop password. Use the button below to choose a new password.</p>
      <p style="text-align:center;margin:28px 0;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#149866;color:#ffffff;text-decoration:none;padding:14px 24px;border-radius:11px;font-weight:700;">Reset my password</a>
      </p>
      <p style="font-size:12px;line-height:1.6;color:#667085;">If you did not request a password reset, you can safely ignore this email.</p>
    </div>
    <div style="padding:18px 30px;border-top:1px solid #eef0f3;color:#98a2b3;font-size:11px;">CampusDrop · A MUXLAB project</div>
  </div>
</div>
